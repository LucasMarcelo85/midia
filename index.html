<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Vídeo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }
        video {
            width: 100%;
            max-width: 720px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            outline: none;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Meu Vídeo Hospedado no Easypanel</h1>
        
        <!-- O atributo controls exibe os botões de play, pause, volume e barra de progresso -->
        <video controls autoplay muted>
            <source src="dani.mp4" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
        </video>
        <video controls autoplay muted>
            <source src="reluty.MP4" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
        </video>
    </div>

</body>
</html>
